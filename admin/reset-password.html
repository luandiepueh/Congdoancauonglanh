<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu - Công Đoàn Cơ Sở</title>
  <link rel="icon" type="image/png" href="../images/logo-congdoan-transparent.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .login-logo { width: 70px; height: 70px; background: linear-gradient(135deg,#b91c1c,#ef4444); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1rem; box-shadow: 0 8px 24px rgba(239,68,68,.4); }
    .btn-login { background: linear-gradient(135deg,#b91c1c,#ef4444); color: #fff; border: none; border-radius: 12px; padding: .78rem; font-size: 1rem; font-weight: 700; width: 100%; transition: all .2s; box-shadow: 0 4px 16px rgba(239,68,68,.35); }
    .btn-login:hover { filter: brightness(1.1); color: #fff; transform: translateY(-1px); }
    .btn-login:disabled { background: #ccc; transform: none; }
  </style>
</head>
<body>
<div class="bg-blob-1"></div><div class="bg-blob-2"></div><div class="bg-blob-3"></div>

<div class="login-card">
  <div class="login-logo"><i class="bi bi-shield-lock-fill text-white"></i></div>
  <h4 class="text-center fw-bold mb-1" style="color:#b71c1c">Đặt lại mật khẩu</h4>
  <p class="text-center text-muted mb-4" style="font-size:.85rem" id="subTitle">Công Đoàn Cơ Sở</p>

  <div id="errMsg" class="alert alert-danger d-none" style="border-radius:10px;font-size:.88rem"></div>
  <div id="okMsg" class="alert alert-success d-none" style="border-radius:10px;font-size:.88rem"></div>

  <div id="checkingWrap" class="text-center text-muted py-3" style="font-size:.88rem">
    <span class="spinner-border spinner-border-sm me-2"></span>Đang xác thực liên kết...
  </div>

  <div id="formWrap" class="d-none">
    <div class="mb-3">
      <label class="form-label fw-semibold" for="password">Mật khẩu mới</label>
      <div class="input-group">
        <span class="input-group-text" style="border-radius:8px 0 0 8px"><i class="bi bi-lock text-muted"></i></span>
        <input type="password" class="form-control" id="password" placeholder="Tối thiểu 6 ký tự" style="border-radius:0 8px 8px 0">
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold" for="password2">Nhập lại mật khẩu mới</label>
      <div class="input-group">
        <span class="input-group-text" style="border-radius:8px 0 0 8px"><i class="bi bi-lock text-muted"></i></span>
        <input type="password" class="form-control" id="password2" placeholder="••••••••" style="border-radius:0 8px 8px 0" onkeypress="if(event.key==='Enter')doReset()">
      </div>
    </div>

    <button class="btn-login" id="resetBtn" onclick="doReset()">
      <span id="resetBtnText"><i class="bi bi-check2-circle me-2"></i>Đặt lại mật khẩu</span>
    </button>
  </div>

  <div id="invalidWrap" class="d-none text-center">
    <p class="text-muted" style="font-size:.88rem">Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. Vui lòng yêu cầu liên kết mới.</p>
    <a href="forgot-password.html" class="btn-login d-inline-block text-decoration-none" style="width:auto;padding:.6rem 1.4rem">Gửi lại liên kết</a>
  </div>

  <div class="text-center mt-3">
    <a href="login.html" class="text-muted text-decoration-none" style="font-size:.83rem">
      <i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script>
  document.getElementById('subTitle').textContent = APP_CONFIG.orgName;

  let recoveryReady = false;

  function showForm() {
    if (recoveryReady) return;
    recoveryReady = true;
    document.getElementById('checkingWrap').classList.add('d-none');
    document.getElementById('formWrap').classList.remove('d-none');
  }

  function showInvalid() {
    if (recoveryReady) return;
    document.getElementById('checkingWrap').classList.add('d-none');
    document.getElementById('invalidWrap').classList.remove('d-none');
  }

  // Supabase phát sự kiện PASSWORD_RECOVERY sau khi đọc token từ URL liên kết trong email
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) showForm();
  });

  // Dự phòng: nếu đã có session hợp lệ khi tải trang (một số trình duyệt xử lý URL trước khi gắn listener)
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) showForm();
  });

  // Hết thời gian chờ mà không có sự kiện nào → coi như liên kết không hợp lệ
  setTimeout(showInvalid, 4000);

  async function doReset() {
    const pwd1  = document.getElementById('password').value;
    const pwd2  = document.getElementById('password2').value;
    const errEl = document.getElementById('errMsg');
    const okEl  = document.getElementById('okMsg');
    const btn   = document.getElementById('resetBtn');

    errEl.classList.add('d-none');
    okEl.classList.add('d-none');

    if (!pwd1 || pwd1.length < 6) { errEl.textContent = 'Mật khẩu phải có ít nhất 6 ký tự.'; errEl.classList.remove('d-none'); return; }
    if (pwd1 !== pwd2) { errEl.textContent = 'Mật khẩu nhập lại không khớp.'; errEl.classList.remove('d-none'); return; }

    btn.disabled = true;
    document.getElementById('resetBtnText').innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...';

    const { error } = await sb.auth.updateUser({ password: pwd1 });

    if (error) {
      errEl.textContent = error.message;
      errEl.classList.remove('d-none');
      btn.disabled = false;
      document.getElementById('resetBtnText').innerHTML = '<i class="bi bi-check2-circle me-2"></i>Đặt lại mật khẩu';
      return;
    }

    document.getElementById('formWrap').classList.add('d-none');
    okEl.textContent = 'Đặt lại mật khẩu thành công! Đang chuyển tới trang đăng nhập...';
    okEl.classList.remove('d-none');
    await sb.auth.signOut();
    setTimeout(() => window.location.href = 'login.html', 2000);
  }
</script>
</body>
</html>
