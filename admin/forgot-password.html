<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - Công Đoàn Cơ Sở</title>
  <link rel="icon" type="image/png" href="../images/logo-congdoan-transparent.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .login-logo { width: 70px; height: 70px; background: linear-gradient(135deg,#b91c1c,#ef4444); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1rem; box-shadow: 0 8px 24px rgba(239,68,68,.4); }
    .btn-login { background: linear-gradient(135deg,#b91c1c,#ef4444); color: #fff; border: none; border-radius: 12px; padding: .78rem; font-size: 1rem; font-weight: 700; width: 100%; transition: all .2s; box-shadow: 0 4px 16px rgba(239,68,68,.35); }
    .btn-login:hover { filter: brightness(1.1); color: #fff; transform: translateY(-1px); }
    .btn-login:disabled { background: #ccc; transform: none; }
  </style>
</head>
<body>
<div class="bg-blob-1"></div><div class="bg-blob-2"></div><div class="bg-blob-3"></div>

<div class="login-card">
  <div class="login-logo"><i class="bi bi-key-fill text-white"></i></div>
  <h4 class="text-center fw-bold mb-1" style="color:#b71c1c">Quên mật khẩu</h4>
  <p class="text-center text-muted mb-4" style="font-size:.85rem" id="subTitle">Công Đoàn Cơ Sở</p>

  <div id="errMsg" class="alert alert-danger d-none" style="border-radius:10px;font-size:.88rem"></div>
  <div id="okMsg" class="alert alert-success d-none" style="border-radius:10px;font-size:.88rem"></div>

  <div id="formWrap">
    <p class="text-muted mb-3" style="font-size:.85rem">Nhập email quản trị của bạn, hệ thống sẽ gửi liên kết đặt lại mật khẩu qua email.</p>
    <div class="mb-4">
      <label class="form-label fw-semibold" for="email">Email</label>
      <div class="input-group">
        <span class="input-group-text" style="border-radius:8px 0 0 8px"><i class="bi bi-envelope text-muted"></i></span>
        <input type="email" class="form-control" id="email" placeholder="admin@email.com" style="border-radius:0 8px 8px 0" onkeypress="if(event.key==='Enter')doSend()">
      </div>
    </div>

    <button class="btn-login" id="sendBtn" onclick="doSend()">
      <span id="sendBtnText"><i class="bi bi-send me-2"></i>Gửi liên kết đặt lại</span>
    </button>
  </div>

  <div class="text-center mt-3">
    <a href="login.html" class="text-muted text-decoration-none" style="font-size:.83rem">
      <i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script>
  document.getElementById('subTitle').textContent = APP_CONFIG.orgName;

  async function doSend() {
    const email  = document.getElementById('email').value.trim();
    const errEl  = document.getElementById('errMsg');
    const okEl   = document.getElementById('okMsg');
    const btn    = document.getElementById('sendBtn');

    errEl.classList.add('d-none');
    okEl.classList.add('d-none');
    if (!email) { errEl.textContent = 'Vui lòng nhập email.'; errEl.classList.remove('d-none'); return; }

    btn.disabled = true;
    document.getElementById('sendBtnText').innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang gửi...';

    const redirectTo = new URL('reset-password.html', window.location.href).href;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

    btn.disabled = false;
    document.getElementById('sendBtnText').innerHTML = '<i class="bi bi-send me-2"></i>Gửi liên kết đặt lại';

    if (error) {
      errEl.textContent = error.message;
      errEl.classList.remove('d-none');
      return;
    }

    // Không tiết lộ email có tồn tại hay không — luôn báo thành công
    document.getElementById('formWrap').classList.add('d-none');
    okEl.textContent = 'Nếu email tồn tại trong hệ thống, một liên kết đặt lại mật khẩu đã được gửi tới hộp thư của bạn. Vui lòng kiểm tra cả mục Spam.';
    okEl.classList.remove('d-none');
  }
</script>
</body>
</html>
